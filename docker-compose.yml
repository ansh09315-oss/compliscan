services:
  compliscan:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compliscan-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/dev.db
      - NEXTAUTH_SECRET=compliscan-super-secure-production-secret-key-32chars
      - NEXTAUTH_URL=http://localhost:3000
    volumes:
      - compliscan-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/auth || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  compliscan-data:
    name: compliscan_data
