# ==============================================================================
# CompliScan AI - Netlify Configuration
# Next.js (React 19) Frontend Deployment to Netlify
# ==============================================================================

[build]
  command = "npx prisma generate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"
  NETLIFY_DISABLE_DRAWER = "true"

# Official Next.js Runtime plugin for Netlify Serverless & App Router support
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ------------------------------------------------------------------------------
# Security & Cross-Origin Resource Sharing (CORS) Headers
# Enables seamless browser communication with Hugging Face Spaces Backend
# ------------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    Access-Control-Allow-Headers = "X-Requested-With, Content-Type, Authorization, Accept, Origin, Cache-Control"
    Access-Control-Allow-Credentials = "true"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets aggressively
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ------------------------------------------------------------------------------
# API Reverse Proxy & Serverless Routing
# Routes /api/py/* directly to the built-in Next.js App Router API on Netlify (/api/v1/*),
# ensuring 100% full-stack operation entirely on Netlify free tier.
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/api/py/*"
  to = "/api/v1/:splat"
  status = 200
  headers = {X-Engine = "CompliScan-Netlify-Serverless"}

