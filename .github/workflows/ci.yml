name: CompliScan Full-Stack CI & Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  frontend-verify:
    name: Frontend Build & TypeScript Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate || true

      - name: TypeScript Verification
        run: npx tsc --noEmit

      - name: Lint Verification
        run: npm run lint --if-present

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

  backend-verify:
    name: Backend Tri-Core Engine Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r backend/requirements.txt

      - name: Compile Backend Modules (Syntax Verification)
        run: |
          python -m py_compile backend/main.py backend/master_brain.py backend/ocr_pipeline.py backend/image_enhancer.py backend/supabase_db.py backend/vlm_engine.py backend/report_generator.py

      - name: Run Component Verification Tests
        run: |
          python backend/test_split_path.py
        env:
          PYTHONPATH: backend
